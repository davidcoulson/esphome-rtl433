# rtl_433 on an ESP32-P4 with an RTL-SDR on the USB host port, serving the Home Assistant
# rtl_433 integration over rtl_433's own HTTP/WebSocket API.
#
# This is the configuration running in the author's house (2026-09-24): a Waveshare-design
# ESP32-P4-WIFI6-POE-ETH (built-in Ethernet, PoE, USB-A high-speed host port) with a Nooelec
# NESDR SMArt v5, hopping between 433.92 MHz (Acurite fridge/freezer sensors) and 915 MHz
# (SCMplus utility meters). One dongle replaces the two-dongle Linux box it used to run on.
#
# After flashing: Settings -> Devices & services -> rtl_433 -> Add hub, host = this device's IP,
# port 8433, path /ws. Devices show up under the hub's "Add discovered devices" once heard.

esphome:
  name: rtl433
  friendly_name: RTL433

esp32:
  variant: esp32p4
  # Pre-v3 and v3+ P4 silicon are not binary compatible. `esptool chip_id` says which you have;
  # v1.x needs engineering_sample: true, v3.x must not set it.
  engineering_sample: true
  flash_size: 16MB
  framework:
    type: esp-idf

# Required: rtl_433's demodulator buffers and the USB sample ring live here.
psram:
  mode: hex
  speed: 200MHz

logger:
  level: INFO
  # The P4's USB-serial/JTAG console can drop out while the USB host stack starts; a real UART
  # is the reliable place for the boot log.
  hardware_uart: UART0

api:
  encryption:
    key: !secret rtl433_api_key   # `esphome` can generate one; keeps the API off the plain LAN
  # Ethernet node: no Wi-Fi reboot timeout, so this is the only automatic recovery from
  # "link up but unreachable".
  reboot_timeout: 300s

ota:
  - platform: esphome
    password: !secret rtl433_ota_password

# Required: every event carries a wall-clock timestamp that the HA integration checks
# against its own clock.
time:
  - platform: homeassistant   # or sntp

# ESP32-P4-WIFI6-POE-ETH / ESP32-P4-ETH: IP101 PHY over RMII
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1

external_components:
  - source: github://davidcoulson/esphome-rtl433@v0.1.7
    components: [rtl_433]

rtl_433:
  # More than one frequency: rtl_433 hops between them. Each band runs only its own decoders.
  # A hop that changes sample rate is applied in place (~0.25 s), so each band can use its own.
  # 915 MHz utility meters hop across 910-920 MHz: the wider 2048k window catches more of them.
  frequencies:
    - frequency: 433.92MHz
      sample_rate: 250k
      hop_interval: 30s
      decoders: [acurite_txr, acurite_606]
    - frequency: 915MHz
      sample_rate: 2048k
      hop_interval: 150s
      decoders: [scmplus, ert_scm, ert_idm, ert_netidm]   # all four ERT meter formats
  # Tuner gain in dB. Left out, the tuner's own AGC (LNA + mixer) runs, which is what rtl_433 on a
  # PC does by default and what hears the most here; set e.g. gain: 40 to pin it.
  # gain: 40
  units: si
  # rtl_433's HTTP API has no authentication. With remote_control off it answers queries only, so
  # nothing on the network can retune the receiver. Home Assistant's integration works either way;
  # only its optional "manage settings" controls need this on.
  remote_control: false
  detector:
    # Track the noise floor: without it rtl_433 only looks at pulses above -12 dBFS, which hides the
    # weaker 915 MHz meters. Also feeds Home Assistant's noise sensor.
    auto_level: true
    # Skip sample pieces below the noise estimate: halves the decoding CPU on a busy 2 MS/s band
    # (99% -> 40% of a core here). This port judges 8 ms pieces and keeps the previous piece, so a
    # short meter burst is neither averaged away nor cut in half at a boundary.
    squelch: true

  # Do not shrink the USB block size (-b) for squelch: each block is a hand-off between cores, and
  # eight times as many of them starves the ESPHome loop. The 8 ms granularity comes from the decoder.

  # Diagnostics (all optional). `dropped_samples` climbing means rtl_433 is not keeping up.
  effective_sample_rate:
    name: Effective Sample Rate
  usb_overruns:
    name: USB Overruns
  dropped_samples:
    name: Dropped Samples
  decoded_events:
    name: Decoded Events
  cpu_load_core0:
    name: CPU Load Core 0
  cpu_load_core1:
    name: CPU Load Core 1
  # Headroom: the least free stack each rtl_433 task has had, and free heap / PSRAM
  decode_stack_free:
    name: Decode Stack Free
  heap_free:
    name: Heap Free
  psram_free:
    name: PSRAM Free

sensor:
  - platform: internal_temperature
    name: Internal Temperature
