# Compile test: Waveshare ESP32-P4-WIFI6-POE-ETH (IP101 over RMII), ESP-IDF 6.1
esphome:
  name: rtl433-test
esp32:
  variant: esp32p4
  engineering_sample: true
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 6.1.0
psram:
  mode: hex
  speed: 200MHz
external_components:
  - source:
      type: local
      path: ../components
logger:
api:
time:
  - platform: sntp
ethernet:
  type: IP101
  mdc_pin: GPIO31
  mdio_pin: GPIO52
  power_pin: GPIO51
  clk:
    mode: CLK_EXT_IN
    pin: GPIO50
  phy_addr: 1
rtl_433:
  hop_interval: 60s
  frequencies:
    - frequency: 433.92MHz
      sample_rate: 250k
      decoders: [acurite_txr, acurite_606]
    - frequency: 915MHz
      sample_rate: 2048k
      hop_interval: 30s
      decoders: [scmplus]
  units: si
  detector:
    fsk_detector: auto
    min_level: -30
    min_snr: 9
    auto_level: true
    squelch: false
    level_estimator: magnitude
  bias_tee: false
  digital_agc: false
  flex_decoders: ["n=test,m=OOK_PWM,s=400,l=1200,r=5000"]
  outputs: ["mqtt://10.2.3.6:1883,retain=0"]
  report_noise: 60s
  tags: {receiver: attic}
  usb_buffer: 1MB
  task_priority: 5
  acquire_priority: 6
  usb_task_priority: 0
  effective_sample_rate: {name: Effective Sample Rate}
  usb_overruns: {name: USB Overruns}
  dropped_samples: {name: Dropped Samples}
  decoded_events: {name: Decoded Events}
  cpu_load_core0: {name: CPU Load Core 0}
  cpu_load_core1: {name: CPU Load Core 1}
